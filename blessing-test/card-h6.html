<style>
:root{
  --crimson-d:#7C1510; --crimson:#A7261C; --crimson-l:#C0392B;
  --gold:#D9A441; --gold-l:#F2D792; --gold-d:#B67E2B;
  --ivory:#FBF4E9; --ivory-d:#F3E6D2; --card:rgba(255,255,255,.80);
  --ink:#43281C; --ink-2:#7A5A44; --red:#B42318;
  --kai:'Kaiti SC','STKaiti','KaiTi','Songti SC','SimSun',serif;
  --sans:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --btnr:999px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--crimson-d);color:var(--ivory);overflow:hidden;transition:background 1.1s ease;-webkit-tap-highlight-color:transparent}
body.opened{background:var(--ivory);color:var(--ink)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

/* ===== 两面：封面 / 内页 ===== */
.face{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
.front{transition:opacity .55s ease,transform .55s ease,visibility 0s linear .55s}
.back{opacity:0;visibility:hidden;transform:translateY(20px);pointer-events:none;
  background:linear-gradient(180deg,rgba(183,63,46,.07) 0,rgba(183,63,46,.02) 200px,rgba(183,63,46,0) 340px),var(--ivory);
  transition:opacity .8s ease .12s,transform .8s ease .12s,visibility 0s linear .95s}
body.opened .back{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .8s ease .12s,transform .8s ease .12s}
body.opened .front{opacity:0;visibility:hidden;pointer-events:none;transform:scale(.98)}

/* ===== 封面 ===== */
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(44px,8vh,76px) 24px 64px}
.front-inner{max-width:600px;width:100%;margin:auto;position:relative;z-index:2}
.lamp{position:absolute;top:clamp(14px,4vh,44px);width:clamp(56px,9vw,86px);opacity:.95;z-index:1;pointer-events:none}
.lamp-l{left:clamp(12px,4vw,60px)}
.lamp-r{right:clamp(12px,4vw,60px);transform:scaleX(-1)}
.cloud{position:absolute;z-index:0;pointer-events:none;opacity:.14}
.c1{left:-30px;bottom:clamp(10px,5vh,46px);width:clamp(120px,22vw,230px)}
.c2{right:-42px;bottom:clamp(4px,3vh,30px);width:clamp(140px,24vw,250px);transform:scaleX(-1)}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold-l);font-family:var(--kai);font-size:13px;letter-spacing:.42em;text-indent:.42em}
.eyebrow .ln{display:inline-block;width:36px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.title{margin:26px 0 12px}
.title .small{display:block;font-family:var(--kai);font-size:clamp(20px,5vw,28px);color:var(--gold-l);letter-spacing:.55em;text-indent:.55em;margin-bottom:8px}
.title .big{display:block;font-family:var(--kai);font-size:clamp(56px,16vw,104px);font-weight:700;line-height:1.12;background:linear-gradient(180deg,#F6E3A8 8%,#E9BE6E 48%,#C08C38 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--gold-l);font-family:var(--kai);font-size:clamp(15px,4vw,18px);letter-spacing:.2em;text-indent:.2em}
.sep{margin:26px 0 30px;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold)}
.sep .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.7}
.sep svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:.08em;padding:14px 34px;border:none;border-radius:var(--btnr);cursor:pointer;transition:transform .25s cubic-bezier(.28,.11,.32,1),filter .25s,background .25s,color .25s,opacity .4s}
.btn svg{width:18px;height:18px}
.btn:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}
.b-open{background:linear-gradient(180deg,#EFC87E,#D9A441 55%,#BE8A35);color:#7C1510;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.b-open:hover{filter:brightness(1.07);transform:translateY(-2px);color:#7C1510}
.b-open:active{transform:translateY(0);filter:brightness(.98)}
.hint{margin-top:18px;font-size:12.5px;color:rgba(242,215,146,.72);letter-spacing:.14em}
.foot{position:absolute;left:0;right:0;bottom:clamp(16px,3.5vh,30px);text-align:center;color:rgba(242,215,146,.5);font-family:var(--kai);font-size:11.5px;letter-spacing:.3em;z-index:2}

/* ===== 内页 ===== */
.back-inner{max-width:640px;width:100%;margin:0 auto;padding:clamp(40px,7vh,72px) 24px clamp(30px,5vh,48px);text-align:center;position:relative}

.eb2{color:var(--gold-d);font-size:13px}
h2{margin:16px 0 8px;font-family:var(--kai);font-size:clamp(38px,10vw,58px);font-weight:700;color:var(--red);letter-spacing:.08em}
.sub2{color:var(--ink-2);font-family:var(--kai);font-size:clamp(15px,4vw,17px);letter-spacing:.18em}
.letter{margin:26px auto 30px;max-width:540px;background:var(--card);border:1px solid color-mix(in srgb,#B42318 16%,transparent);border-radius:22px;padding:clamp(24px,5vw,34px) clamp(20px,5vw,34px);text-align:left;box-shadow:0 10px 30px rgba(176,116,42,.10)}
.letter p{font-family:var(--kai);font-size:clamp(15.5px,4.4vw,17.5px);line-height:2.05;color:var(--ink);text-indent:2em;margin-bottom:.4em}
.letter .greet{text-indent:0;font-weight:700;font-size:clamp(17px,4.8vw,19px)}
.letter .sign{margin-top:16px;text-indent:0;text-align:right;color:var(--ink-2);font-size:clamp(14px,4vw,15.5px);letter-spacing:.06em}
.acts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center}
.b-fire{background:var(--red);color:#FBF4E9;box-shadow:0 10px 22px rgba(180,35,24,.3)}
.b-fire:hover{background:#C0392B;color:#FBF4E9;transform:translateY(-2px)}
.b-fire:active{transform:none}
.b-back{background:transparent;color:var(--ink-2);border:1px solid color-mix(in srgb,var(--ink-2) 40%,transparent)}

.hint2{margin-top:16px;font-size:12.5px;color:color-mix(in srgb,var(--ink-2) 72%,transparent);letter-spacing:.1em}
.foot2{margin-top:26px;font-family:var(--kai);font-size:12.5px;color:color-mix(in srgb,var(--ink-2) 65%,transparent);letter-spacing:.3em}
.plum{position:absolute;width:clamp(88px,18vw,140px);opacity:.5;pointer-events:none}

@media (max-height:560px){

  .letter{margin:18px auto 20px}

}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

<script>
(function(){
  var body=document.body;
  var openBtn=document.getElementById('openBtn');
  var fireBtn=document.getElementById('fireBtn');
  var backBtn=document.getElementById('backBtn');
  var cv=document.getElementById('fx'), ctx=cv.getContext('2d');
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,ps=[],fls=[],last=0;
  function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
  window.addEventListener('resize',resize); resize();
  var COLS=['#F6E3A8','#FFE4B5','#FFD9A0','#FFB8A6','#E9D2F2','#FFF6E0'];
  function burst(x,y,n){
    n=n||70;
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2, sp=50+Math.random()*260;
      ps.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,g:150,life:1,dec:.75+Math.random()*.5,c:COLS[(Math.random()*COLS.length)|0],s:1.6+Math.random()*2.4});
    }
    if(ps.length>950) ps.splice(0,ps.length-950);
  }
  function snow(){
    fls.push({x:Math.random()*W,y:-14,s:1.8+Math.random()*3,vy:16+Math.random()*26,vx:(Math.random()-.5)*12,a:.3+Math.random()*.45,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.12,c:COLS[(Math.random()*3)|0]});
    if(fls.length>160) fls.shift();
  }
  function step(ts){
    if(!last) last=ts;
    var dt=Math.min((ts-last)/1000,.05); last=ts;
    if(!reduced && Math.random()<dt*16) snow();
    for(var i=fls.length-1;i>=0;i--){ var f=fls[i]; f.y+=f.vy*dt; f.x+=f.vx*dt; f.rot+=f.vr*dt; if(f.y>H+16) fls.splice(i,1); }
