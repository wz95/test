<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新春贺卡 · 致妈妈</title>
<meta name="description" content="亲爱的妈妈：新岁愿您三餐四季，平安喜乐；眉目舒展，笑口常开。">
<meta property="og:title" content="新春贺卡 · 致妈妈">
<meta property="og:description" content="亲爱的妈妈：新岁愿您三餐四季，平安喜乐；眉目舒展，笑口常开。">
<meta property="og:image" content="https://test.wengzhe.cn/blessing-test/card-h2-thumb.jpg">
<meta itemprop="name" content="新春贺卡 · 致妈妈">
<meta itemprop="description" content="亲爱的妈妈：新岁愿您三餐四季，平安喜乐；眉目舒展，笑口常开。">
<meta itemprop="image" content="https://test.wengzhe.cn/blessing-test/card-h2-thumb.jpg">

<style>
  :root{
    --bg1:#6E1119; --bg2:#8E1B27; --bg3:#54101A;
    --gold:#E3B557; --gold-hi:#F7D489; --gold-lo:#B27C2A;
    --paper:#FAF3E2; --paper2:#F2E6CC;
    --ink:#5A1B20; --ink2:#8A4B45; --red:#B8303E; --red-d:#8E2230;
    --disp:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC","SimSun",serif;
    --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --radius:18px; --btnr:999px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--body);
    background:radial-gradient(130% 100% at 50% 0%, var(--bg2) 0%, var(--bg1) 55%, var(--bg3) 100%);
    background-attachment:fixed;
    color:var(--paper);
    min-height:100svh; overflow-x:hidden;
  }
  button{font-family:inherit}

  /* 背景粒子画布（纯装饰，不拦截点击） */
  #fx{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:40}

  .wrap{perspective:1200px}

  /* ============ 封面 ============ */
  .cover{
    position:relative; min-height:100svh; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(28px,6vw,72px) 24px;
    transform-origin:top center;
  }
  .cover.flip{animation:flapUp .95s cubic-bezier(.55,.06,.68,.19) forwards}
  .cover.gone{display:none}
  @keyframes flapUp{
    0%{transform:rotateX(0deg) translateY(0); opacity:1}
    100%{transform:rotateX(-74deg) translateY(-7vh); opacity:0}
  }
  .cover-inner{
    position:relative; width:min(880px,100%);
    display:flex; flex-direction:column; align-items:center; gap:clamp(18px,3.5vh,34px);
    padding:clamp(20px,4vw,48px) clamp(12px,3vw,32px) clamp(26px,5vw,44px);
  }
  .eyebrow{
    font-family:var(--disp); font-size:clamp(15px,2.6vw,19px); letter-spacing:.5em;
    color:var(--gold); text-indent:.5em; font-weight:600;
  }
  .eyebrow::before,.eyebrow::after{content:"❋"; font-size:.7em; color:var(--gold-lo); margin:0 .6em; display:inline-block}
  .title-row{display:flex; align-items:center; justify-content:center; gap:clamp(18px,4vw,40px); flex-wrap:wrap}
  .title{
    display:flex; flex-direction:column; align-items:center; gap:.14em;
    font-family:var(--disp); font-weight:700; line-height:1.08;
    font-size:clamp(3.3rem,16vw,6.6rem);
    background:linear-gradient(180deg,#FBE6B0 0%,#EEC46A 46%,#C08A33 82%,#A96F22 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.38));
  }
  .stamp{
    width:clamp(68px,14vw,92px); height:clamp(68px,14vw,92px); border-radius:50%; flex:none;
    background:radial-gradient(circle at 34% 28%, #E03A4B, #A81F2E 70%);
    border:3px solid var(--gold-hi);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--disp); font-size:clamp(36px,9vw,52px); color:var(--gold-hi);
    box-shadow:0 8px 22px rgba(0,0,0,.35), inset 0 0 0 4px rgba(0,0,0,.14);
  }
  .to{
    font-family:var(--disp); font-size:clamp(20px,4.5vw,30px); letter-spacing:.28em; text-indent:.28em;
    color:var(--paper); font-weight:600;
  }
  .to b{color:var(--gold-hi)}
  .open-btn{
    appearance:none; border:none; cursor:pointer;
    background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 55%,#C9983B 100%);
    color:var(--ink); font-size:clamp(16px,3.4vw,19px); font-weight:700; letter-spacing:.2em; text-indent:.2em;
    padding:15px 42px; border-radius:var(--btnr);
    box-shadow:0 10px 26px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .25s cubic-bezier(.28,.11,.32,1), filter .25s;
  }
  .open-btn:hover{transform:translateY(-3px); filter:brightness(1.05)}
  .open-btn:active{transform:translateY(0); filter:brightness(.96)}
  .open-btn:focus-visible{outline:3px solid var(--gold-hi); outline-offset:3px}
  .hint{font-size:clamp(12px,2.4vw,14px); letter-spacing:.3em; text-indent:.3em; color:rgba(247,212,137,.82)}

  /* 祥云暗纹 */
  .cloud{position:absolute; opacity:.16; pointer-events:none}
  .cloud.c1{top:9%; left:5%; width:min(240px,30vw)}
  .cloud.c2{bottom:10%; right:4%; width:min(300px,38vw); transform:scaleX(-1)}

  /* ============ 内页 ============ */
  .content{
    opacity:0; transform:translateY(36px); pointer-events:none;
    transition:opacity .7s ease .18s, transform .7s ease .18s;
    padding:clamp(18px,4.5vw,44px) clamp(12px,3vw,32px) clamp(36px,7vw,64px);
    display:flex; justify-content:center;
  }
  .content.show{opacity:1; transform:none; pointer-events:auto}
  .paper{
    position:relative; width:min(900px,100%);
    background:linear-gradient(180deg,var(--paper) 0%,var(--paper2) 100%);
    border-radius:var(--radius);
    border:1px solid rgba(227,181,87,.6);
    padding:clamp(26px,5.5vw,60px) clamp(20px,5vw,56px) clamp(30px,6vw,60px);
    color:var(--ink);
    box-shadow:0 34px 90px rgba(0,0,0,.4);
  }
  .corner{position:absolute; width:36px; height:36px; border:2px solid rgba(178,124,42,.55); pointer-events:none}
  .corner.tl{top:12px; left:12px; border-right:none; border-bottom:none; border-radius:12px 0 0 0}
  .corner.tr{top:12px; right:12px; border-left:none; border-bottom:none; border-radius:0 12px 0 0}
  .corner.bl{bottom:12px; left:12px; border-right:none; border-top:none; border-radius:0 0 0 12px}
  .corner.br{bottom:12px; right:12px; border-left:none; border-top:none; border-radius:0 0 12px 0}

  .blossom-branch{display:block; margin:-8px auto 10px; width:min(340px,88%); height:auto}

  .paper h2{
    text-align:center; font-family:var(--disp); font-weight:700;
    font-size:clamp(30px,7vw,44px); color:var(--red-d); letter-spacing:.12em;
  }
  .paper h2::before,.paper h2::after{
    content:""; display:inline-block; width:clamp(28px,6vw,54px); height:2px;
    background:linear-gradient(90deg,transparent,rgba(178,124,42,.7),transparent);
    vertical-align:middle; margin:0 clamp(8px,2vw,16px);
  }
  .sub{
    text-align:center; font-size:clamp(13px,2.8vw,15px); letter-spacing:.35em; text-indent:.35em;
    color:var(--ink2); margin:10px 0 22px;
  }
  .poem{
    text-align:center; font-size:clamp(15px,3.4vw,17.5px); line-height:2; color:var(--ink);
    padding:6px 4px 4px;
  }
  .poem .hi{color:var(--red-d); font-weight:600}
  .bless-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:clamp(10px,2.4vw,16px); margin:26px 0 6px;
  }
  .ticket{
    background:linear-gradient(160deg,#F8EBC9 0%,#EED9A2 100%);
    border:1px solid rgba(178,124,42,.38); border-radius:14px;
    padding:16px 10px 13px; text-align:center;
  }
  .ticket .main{
    font-family:var(--disp); font-weight:700; font-size:clamp(21px,4.6vw,27px);
    color:var(--red-d); letter-spacing:.14em; writing-mode:vertical-rl; height:3.2em;
    margin:0 auto;
  }
  .ticket .sub2{font-size:clamp(12px,2.6vw,13.5px); color:var(--ink2); letter-spacing:.18em; margin-top:4px}

  .lantern-zone{margin:30px 0 8px; text-align:center}
  .lantern-line{height:2px; width:min(430px,100%); margin:0 auto 4px;
    background:linear-gradient(90deg,transparent,rgba(122,74,31,.5),transparent)}
  .lantern-tip{font-size:clamp(13px,3vw,15px); color:var(--ink2); letter-spacing:.1em; margin-bottom:8px}
  .lanterns{display:flex; justify-content:center; gap:clamp(2px,1.6vw,10px); flex-wrap:wrap}
  .lantern{
    background:none; border:none; cursor:pointer; padding:6px 4px;
    width:clamp(56px,13vw,72px); transition:transform .25s;
  }
  .lantern:hover{transform:translateY(-5px)}
  .lantern:focus-visible{outline:3px solid var(--red); outline-offset:2px; border-radius:12px}
  .lantern svg{display:block; width:100%; height:auto}
  .lantern .body{fill:#C93A45; transition:fill .45s ease}
  .lantern .trim{fill:#7a4a1f}
  .lantern.lit .body{fill:#FF7A45}
  .lantern.lit{filter:drop-shadow(0 0 12px rgba(255,150,70,.95))}
  .lantern-note{
    margin:14px auto 0; font-family:var(--disp); font-weight:700;
    font-size:clamp(17px,4vw,22px); color:var(--red-d); letter-spacing:.18em;
    opacity:0; transform:translateY(8px); transition:opacity .6s ease .1s, transform .6s ease .1s;
  }
  .lantern-note.shown{opacity:1; transform:none}

  .sign{text-align:right; margin-top:30px; font-family:var(--disp); font-size:clamp(16px,3.6vw,19px); letter-spacing:.12em; color:var(--ink)}
  .sign::before{content:"— "; color:var(--gold-lo)}
  .year{text-align:center; margin-top:10px; font-size:clamp(12px,2.6vw,13.5px); letter-spacing:.4em; text-indent:.4em; color:var(--ink2)}
  .back-btn{
    display:block; margin:26px auto 0; appearance:none; cursor:pointer;
    background:transparent; border:1.5px solid var(--gold-lo); color:var(--ink2);
    font-size:clamp(14px,3vw,15px); font-weight:700; letter-spacing:.22em; text-indent:.22em;
    padding:11px 34px; border-radius:var(--btnr); transition:all .25s;
  }
  .back-btn:hover{background:var(--gold-lo); color:var(--paper)}
  .back-btn:focus-visible{outline:3px solid var(--gold-lo); outline-offset:3px}

  @media (prefers-reduced-motion: reduce){
    .cover.flip{animation-duration:.01s}
    .content{transition:none}
    html{scroll-behavior:auto}
    .lantern,.open-btn,.back-btn{transition:none}
  }
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <!-- ===== 封面 ===== -->
  <section class="cover" id="cover" aria-label="贺卡封面">

      <h2>妈妈，新年快乐</h2>

<script>
(function(){
  /* ===== 粒子画布：飘落花瓣 + 点击烟花 ===== */
  var cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  var W = 0, H = 0;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORS = ['#F2A0A8','#E9808B','#F6C3C8','#FBE3DE'];
  var petals = [], parts = [];
  function mkPetal(anywhere){
    petals.push({
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -20,
      r: 2.5 + Math.random() * 3.5,
      vy: 0.3 + Math.random() * 0.55,
      vx: (Math.random() - 0.5) * 0.25,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.025,
      ph: Math.random() * Math.PI * 2,
      sw: 0.4 + Math.random() * 0.6,
      c: COLORS[Math.floor(Math.random() * COLORS.length)],
      a: 0.3 + Math.random() * 0.35
    });
  }
  var N = reduced ? 6 : 26;
  for (var i = 0; i < N; i++) mkPetal(true);

  function burst(x, y){
    var cols = ['#F7D489','#E3B557','#FF9A6B','#FFD9A0'];
    for (var i = 0; i < 34; i++){
      var ang = Math.random() * Math.PI * 2;
      var sp = 1.2 + Math.random() * 3.6;
      parts.push({ x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 1.2, life:1,
        dec:0.014 + Math.random()*0.012, r:1.4 + Math.random()*1.8, c:cols[i % cols.length] });
    }
  }

  function step(){
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < petals.length; i++){
      var p = petals[i];
      p.ph += 0.03;
      p.x += p.vx + Math.sin(p.ph) * p.sw * 0.35;
      p.y += p.vy; p.rot += p.vr;
      if (p.y > H + 16 || p.x < -16 || p.x > W + 16){ p.x = Math.random() * W; p.y = -16; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = p.a; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    for (var j = parts.length - 1; j >= 0; j--){
      var q = parts[j];
      q.life -= q.dec;
      if (q.life <= 0){ parts.splice(j, 1); continue; }
      q.vx *= 0.985; q.vy *= 0.985; q.vy += 0.045;
      q.x += q.vx; q.y += q.vy;
      ctx.globalAlpha = Math.max(q.life, 0); ctx.fillStyle = q.c;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);   // 显式启动动画循环
  window.burstFX = burst;

  /* ===== 封面翻开 / 返回 ===== */
  var cover = document.getElementById('cover');
  var content = document.getElementById('content');
  var openBtn = document.getElementById('openBtn');
  var backBtn = document.getElementById('backBtn');

  function fireAt(el){
    var r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
  }

  openBtn.addEventListener('click', function(){
    if (cover.classList.contains('flip')) return;
    cover.classList.add('flip');
    window.scrollTo(0, 0);
    fireAt(openBtn);
    setTimeout(function(){
      cover.classList.add('gone');
      content.classList.add('show');
      window.scrollTo(0, 0);
    }, 880);
  });

  backBtn.addEventListener('click', function(){
    content.classList.remove('show');
    setTimeout(function(){
      cover.classList.remove('gone', 'flip');
      window.scrollTo(0, 0);
    }, 520);
  });

  /* ===== 点亮灯笼 ===== */
  var lanterns = Array.prototype.slice.call(document.querySelectorAll('.lantern'));
  var lit = 0;
  var note = document.getElementById('note');
  lanterns.forEach(function(el){
    el.addEventListener('click', function(){
      if (el.classList.contains('lit')) return;
      el.classList.add('lit');
      lit++;
      fireAt(el);
      if (lit === lanterns.length) note.classList.add('shown');
    });
  });
})();
</script>
