<style>
:root{
  --bg-top:#A3122B; --bg:#8E0E1E; --bg-bottom:#6E0B16;
  --surface:#FFF6E2; --tint:rgba(255,246,226,.97);
  --t1:#8E0E1E; --t2:#5C0E16; --t3:#7A5A2A;
  --acc:#D4AF37; --acc-h:#E4BE50; --on:#8E0E1E;
  --gold:#F6D47A; --gold-deep:#C8922A; --gold-pale:#FBEED0;
  --border:rgba(246,212,122,.45);
  --radius:22px; --btnr:980px; --ctrl:14px;
  --hero-w:700;
  --disp:"Kaiti SC","STKaiti","KaiTi","FZKai-Z03S","Songti SC","PingFang SC",serif;
  --body:"Songti SC","STSong","SimSun","PingFang SC",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  min-height:100%;
  font-family:var(--body);
  color:var(--gold-pale);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg) 45%,var(--bg-bottom) 100%);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hidden-defs{position:absolute;width:0;height:0;overflow:hidden}

/* 顶部悬挂灯笼 */
.lantern-row{position:relative;z-index:2;max-width:520px;margin:0 auto;height:0}
.lantern{position:absolute;top:2px;width:clamp(86px,24vw,124px);pointer-events:none}
.lantern.left{left:2px}
.lantern.right{right:2px}
.lantern svg{width:100%;height:auto;display:block}
.swing{transform-origin:50% 0;animation:swing 3.8s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-4.5deg)}to{transform:rotate(4.5deg)}}

.page{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 22px calc(44px + env(safe-area-inset-bottom))}

/* Hero */
.hero{padding:106px 0 0;text-align:center}
.eyebrow{display:block;font-family:var(--disp);font-size:13px;letter-spacing:6px;text-indent:6px;color:var(--gold);opacity:.95}
.seal{
  width:clamp(74px,20vw,92px);aspect-ratio:1/1;max-width:100%;
  margin:20px auto 22px;border-radius:50%;
  background:linear-gradient(160deg,#FBE9B0 0%,#E9BE57 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(255,244,196,.55), inset 0 0 0 5px rgba(148,23,39,.13);
}
.seal span{font-family:var(--disp);font-size:2.35em;font-weight:700;color:#8E0E1E;line-height:1}
h1{
  font-family:var(--disp);font-weight:700;
  font-size:clamp(46px,13vw,70px);
  letter-spacing:.14em;text-indent:.14em;line-height:1.15;
  background:linear-gradient(180deg,#FFF6D0 0%,#F4C95C 62%,#C88F22 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 9px rgba(52,0,8,.5));
}
.sub{margin-top:14px;font-family:var(--disp);font-size:clamp(17px,5vw,21px);color:var(--gold-pale);letter-spacing:.34em;text-indent:.34em}

/* 金线分隔 */
.divider{display:flex;align-items:center;gap:14px;width:min(80%,340px);margin:30px auto 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(246,212,122,.55),transparent)}
.divider svg{width:26px;height:26px;flex:none;display:block}

/* 祝福卡 */
.card{
  position:relative;margin:34px auto 0;
  background:var(--tint);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:36px 30px 30px;
  color:var(--t2);
  box-shadow:0 0 0 6px rgba(246,212,122,.12);
}
.corner{position:absolute;width:26px;height:26px;border:2.5px solid #D4AF37;opacity:.9}
.corner.tl{top:11px;left:11px;border-right:0;border-bottom:0;border-top-left-radius:9px}
.corner.tr{top:11px;right:11px;border-left:0;border-bottom:0;border-top-right-radius:9px}
.corner.bl{bottom:11px;left:11px;border-right:0;border-top:0;border-bottom-left-radius:9px}
.corner.br{bottom:11px;right:11px;border-left:0;border-top:0;border-bottom-right-radius:9px}
.salute{font-family:var(--disp);font-size:21px;font-weight:700;color:var(--t1);letter-spacing:.08em;margin-bottom:18px}
.card p.body{font-size:16.5px;line-height:2;letter-spacing:.03em;margin-bottom:15px;color:var(--t2);text-align:justify}
.para-flower{display:flex;justify-content:center;margin:6px 0 16px}
.para-flower svg{width:21px;height:21px;display:block}
.endline{
  margin-top:8px;text-align:center;
  font-family:var(--disp);font-weight:700;font-size:19.5px;
  color:var(--t1);letter-spacing:.09em;line-height:1.6;
}

/* 落款 */
footer{margin-top:36px;text-align:center}
.sign{font-family:var(--disp);font-size:17px;letter-spacing:.14em;text-indent:.14em;color:var(--gold)}
.date{margin-top:10px;font-size:13px;letter-spacing:.24em;text-indent:.24em;color:var(--gold-pale);opacity:.9}
.foot-deco{display:flex;justify-content:center;gap:12px;margin-top:28px}
.foot-deco svg{width:46px;height:auto;display:block}
.tip{margin-top:22px;text-align:center;font-size:12.5px;letter-spacing:.16em;text-indent:.16em;color:#F2D98F}

/* 入场动画 */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.rise{animation:rise .95s cubic-bezier(.22,.7,.3,1) both}
.rise.d1{animation-delay:.15s}
.rise.d2{animation-delay:.3s}
.rise.d3{animation-delay:.46s}
.rise.d4{animation-delay:.66s}

@media (prefers-reduced-motion: reduce){
  .swing,.rise{animation:none}
}

<div class="page">

<script>
(function(){
  var cv=document.getElementById('fx');
  var c=cv.getContext('2d');
  var W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
    c.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize);
  resize();

  var COLORS=['#F6D47A','#FFEDB0','#E23A45','#FFD24A','#FFF3C4','#E98A2E','#FFE9A8'];
  var parts=[],rockets=[],golds=[];
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function burst(x,y){
    var n=44+Math.floor(Math.random()*22);
    var c1=COLORS[Math.floor(Math.random()*COLORS.length)];
    var c2=COLORS[Math.floor(Math.random()*COLORS.length)];
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2;
      var sp=90+Math.random()*330;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,
        life:1,decay:0.36+Math.random()*0.34,
        col:i%3===0?c2:c1,r:1.3+Math.random()*1.7});
    }
  }
  function launch(){
    rockets.push({x:W*0.12+Math.random()*W*0.76,y:H+8,
      vx:(Math.random()-0.5)*0.9,vy:-(300+Math.random()*260),
      target:H*(0.12+Math.random()*0.2)});
  }
  function gold(){
    if(golds.length<70)
      golds.push({x:Math.random()*W,y:-14,vy:20+Math.random()*50,
        vx:(Math.random()-0.5)*0.5,ph:Math.random()*Math.PI*2,
        sp:0.6+Math.random()*0.9,r:2+Math.random()*3.5,
        a:0.45+Math.random()*0.5,rot:Math.random()*Math.PI});
  }

  var last=null,nextLaunch=1000,nextGold=0;
  function frame(ts){
    if(last===null)last=ts;
    var dt=Math.min((ts-last)/1000,0.033);last=ts;

    c.clearRect(0,0,W,H);

    for(var i=golds.length-1;i>=0;i--){
      var g=golds[i];
      g.y+=g.vy*dt; g.x+=g.vx*dt+Math.sin(g.ph+g.y*0.02)*g.sp;
      g.rot+=dt*1.5;
      if(g.y>H+16){golds.splice(i,1);continue;}
      c.globalAlpha=g.a;
      c.fillStyle='#F6D47A';
      c.save();c.translate(g.x,g.y);c.rotate(g.rot);
      c.fillRect(-g.r/2,-g.r/2,g.r,g.r);c.restore();
    }

    for(var j=rockets.length-1;j>=0;j--){
      var r=rockets[j];
      r.x+=r.vx*dt; r.y+=r.vy*dt; r.vy+=140*dt;
      if(r.y<=r.target){burst(r.x,r.y);rockets.splice(j,1);continue;}
      c.globalAlpha=0.9;
      c.fillStyle='#FFEDB0';
      c.beginPath();c.arc(r.x,r.y,2,0,6.2832);c.fill();
    }

    for(var k=parts.length-1;k>=0;k--){
      var p=parts[k];
      p.vx*=0.985; p.vy*=0.985;
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt;
      p.life-=p.decay*dt;
      if(p.life<=0){parts.splice(k,1);continue;}
      c.globalAlpha=Math.max(p.life,0);
      c.fillStyle=p.col;
      c.beginPath();c.arc(p.x,p.y,p.r,0,6.2832);c.fill();
    }
    c.globalAlpha=1;

    if(ts>nextLaunch){launch();nextLaunch=ts+1400+Math.random()*1600;}
    if(ts>nextGold){gold();nextGold=ts+260+Math.random()*380;}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if(!reduced){
    document.addEventListener('pointerdown',function(e){
      burst(e.clientX,e.clientY);
    });
  }
})();
</script>
