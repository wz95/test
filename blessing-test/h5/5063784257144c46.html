<style>
/* ===== 共享层（暖调商业 warm-commerce） ===== */
body[data-theme="warm-commerce"]{
  --bg:#FFF8F0; --tint:#FBEFE2; --surface:#fff;
  --t1:#2A1D14; --t2:#6B5445; --t3:#A8917E;
  --acc:#E8552D; --acc-h:#CF4522; --on:#fff;
  --good:#147A54; --warn:#B45309; --bad:#C62F1F;
  --radius:12px; --btnr:12px; --hero-w:800; --bstr:11%;
  --disp:'Inter',-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --body:var(--disp);
  --border:color-mix(in srgb,var(--t1) var(--bstr),transparent);
  --card:var(--tint);
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ -webkit-text-size-adjust:100%; }
body{
  font-family:var(--body); background:var(--bg); color:var(--t2);
  line-height:1.6; min-height:100svh; overflow-x:hidden;
}
.card,.tile,.pill,.inp{ corner-shape:squircle; }
img{ max-width:100%; }

/* ===== 烟花画布（装饰层） ===== */
#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }

/* ===== 主容器 ===== */
.wrap{ position:relative; z-index:2; max-width:600px; margin:0 auto; padding:56px 22px 48px; }

/* ===== Hero ===== */
.hero{ text-align:center; padding:18px 0 30px; }
.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  padding:6px 16px; border-radius:9999px;
  background:color-mix(in srgb,var(--acc) 13%,var(--bg));
  color:var(--acc); font-size:13px; font-weight:700; letter-spacing:.14em;
}
.eyebrow svg{ width:14px; height:14px; }
h1{
  font-size:clamp(44px,9vw,66px); font-weight:800; color:var(--t1);
  letter-spacing:.06em; margin:20px 0 6px; line-height:1.15;
}
.hero .sub{ font-size:17px; color:var(--t2); font-weight:600; margin-top:6px; }
.hero .year{ display:inline-block; margin-top:14px; font-size:13px; color:var(--t3); letter-spacing:.22em; }

/* 灯笼装饰 */
.lantern{ position:absolute; top:64px; width:46px; height:66px; pointer-events:none; z-index:2; opacity:.9; }
.lantern.l{ left:calc(50% - 320px); }
.lantern.r{ right:calc(50% - 320px); transform:scaleX(-1); }
.lantern .sway{ animation:sway 4.5s ease-in-out infinite; transform-origin:top center; }
@keyframes sway{ 0%,100%{ transform:rotate(-3deg);} 50%{ transform:rotate(3deg);} }

/* ===== 照片主卡 ===== */
.photo-card{
  position:relative; background:var(--surface); border-radius:var(--radius);
  padding:10px; box-shadow:0 10px 26px rgba(42,29,20,.10);
  border:1px solid color-mix(in srgb,var(--t1) 8%,transparent);
}
.photo-card .inner{ position:relative; border-radius:8px; overflow:hidden; }
.photo-card img{ width:100%; height:auto; display:block; border-radius:8px; }
.fu-badge{
  position:absolute; top:14px; right:14px; z-index:3;
  background:var(--acc); color:var(--on);
  font-size:15px; font-weight:800; line-height:1;
  padding:11px 14px; border-radius:9999px;
  box-shadow:0 4px 12px rgba(232,85,45,.38);
  letter-spacing:.04em;
}
.photo-cap{ text-align:center; padding:12px 6px 4px; font-size:13px; color:var(--t3); letter-spacing:.1em; }

/* ===== 祝福区 ===== */
.bless{ background:var(--surface); border-radius:var(--radius); padding:26px 26px 22px; margin-top:22px; border:1px solid color-mix(in srgb,var(--t1) 8%,transparent); }
.bless .head{ text-align:center; font-size:13px; font-weight:700; color:var(--acc); letter-spacing:.18em; margin-bottom:16px; }
.bless .head::before, .bless .head::after{ content:""; display:inline-block; vertical-align:middle; width:22px; height:1px; background:color-mix(in srgb,var(--acc) 40%,transparent); margin:0 8px; }
.bless p{ font-size:16px; color:var(--t2); line-height:2; text-align:center; }
.bless p.big{ font-size:19px; font-weight:700; color:var(--t1); }
.bless p.sig{ margin-top:18px; font-size:14px; color:var(--t3); letter-spacing:.08em; }

/* ===== 交互区 ===== */
.act{ text-align:center; margin:28px 0 6px; }
.btn{
  display:inline-flex; align-items:center; gap:9px;
  background:var(--acc); color:var(--on); border:none; cursor:pointer;
  font-family:var(--body); font-size:16px; font-weight:700;
  padding:13px 26px; border-radius:var(--btnr);
  box-shadow:0 6px 16px rgba(232,85,45,.30);
  transition:background .25s cubic-bezier(.28,.11,.32,1), transform .25s cubic-bezier(.28,.11,.32,1);
}
.btn:hover,.btn:focus,.btn:active{ background:var(--acc-h); color:var(--on); }
.btn:active{ transform:translateY(1px); }
.btn:focus-visible{ outline:2px solid var(--acc); outline-offset:3px; }
.btn svg{ width:18px; height:18px; }
.act .hint{ margin-top:10px; font-size:12px; color:var(--t3); }

/* ===== 底部 ===== */
.foot{ text-align:center; margin-top:34px; padding-top:20px; border-top:1px dashed color-mix(in srgb,var(--t1) 14%,transparent); }
.foot .love{ font-size:16px; font-weight:700; color:var(--t1); letter-spacing:.1em; }
.foot .meta{ margin-top:6px; font-size:12px; color:var(--t3); letter-spacing:.06em; }

/* ===== 响应式 ===== */
@media (max-width:720px){
  .lantern{ display:none; }
  .wrap{ padding:44px 20px 40px; }
}
@media (prefers-reduced-motion:reduce){
  .lantern .sway{ animation:none; }
}
</style>

<script>
(function(){
  'use strict';
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0;
  var parts = [];
  var COLORS = ['#E8552D', '#F2B64B', '#F97316', '#147A54', '#FFE9D6', '#FFFFFF'];

  function resize(){
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function burst(cx, cy, n, spd){
    for (var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2;
      var v = (0.5 + Math.random() * 1.0) * spd;
      parts.push({
        x: cx, y: cy,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life: 1,
        decay: 0.007 + Math.random() * 0.012,
        r: 1.6 + Math.random() * 2.2,
        c: COLORS[Math.floor(Math.random() * COLORS.length)],
        g: 0.045
      });
    }
  }

  function frame(){
    ctx.clearRect(0, 0, W, H);
    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.life -= p.decay;
      if (p.life <= 0){ parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life + 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  frame();  // 初始化即启动循环

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 自动小烟花（尊重 reduced-motion：仅点击触发）
  if (!reduceMotion){
    setInterval(function(){
      var cx = 80 + Math.random() * (W - 160);
      var cy = 60 + Math.random() * (H * 0.45);
      burst(cx, cy, 26, 2.1);
    }, 2400);
  }

  var btn = document.getElementById('fireBtn');
  btn.addEventListener('click', function(){
    var cx = W * 0.5, cy = H * 0.38;
    burst(cx, cy, 56, 3.4);
    burst(cx - 60, cy + 30, 34, 2.6);
    burst(cx + 60, cy + 30, 34, 2.6);
  });
})();
