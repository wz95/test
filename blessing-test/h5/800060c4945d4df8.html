<style>
/* ===== 共享层 + 暖调商业主题 token ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  --bg:#FFF8F0; --tint:#FBEFE2; --surface:#fff;
  --t1:#2A1D14; --t2:#6B5445; --t3:#A8917E;
  --acc:#E8552D; --acc-h:#CF4522; --on:#fff;
  --good:#147A54; --radius:16px; --btnr:12px; --bstr:11%;
  --disp:'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  --border:color-mix(in srgb,var(--t1) var(--bstr),transparent);
  background:var(--bg); color:var(--t2);
  font-family:var(--disp); line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* ===== 烟花粒子装饰层 ===== */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
/* ===== 舞台 ===== */
.stage{position:relative;z-index:2;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
/* ===== 封面 ===== */
.cover{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#E8552D 0%,#C93F1E 55%,#A92F12 100%);
  color:#fff;text-align:center;padding:32px 20px 24px;
  transition:opacity .55s cubic-bezier(.28,.11,.32,1),visibility .55s;
}
body.opened .cover{opacity:0;visibility:hidden;pointer-events:none}
.cover .pill-top{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,248,240,.16);border:1px solid rgba(255,248,240,.45);
  border-radius:999px;padding:6px 16px;font-size:12.5px;font-weight:700;letter-spacing:2px;color:#FFF8F0;
}
.cover h1{
  margin:18px 0 6px;font-size:clamp(46px,13vw,72px);font-weight:800;
  letter-spacing:6px;color:#fff;line-height:1.12;text-shadow:0 2px 18px rgba(120,30,8,.35);
}
.cover .year{font-size:clamp(15px,4vw,19px);font-weight:700;letter-spacing:10px;color:#FFE3C7;margin-bottom:10px}
.cover .sub{max-width:300px;font-size:14px;color:#FFEFE0;line-height:1.9;margin:6px auto 26px}
.cover .lanterns{display:flex;gap:64px;align-items:center;justify-content:center;margin:8px 0 6px}
.lantern{width:52px;height:auto;color:#FFD9A0;opacity:.95}
.lantern.sm{width:36px;color:#FFC46B;opacity:.8}
/* 开启按钮 */
.open-btn{
  appearance:none;border:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:10px;
  background:#FFF8F0;color:#C93F1E;
  font-family:inherit;font-size:16px;font-weight:800;letter-spacing:2px;
  padding:15px 34px;border-radius:999px;
  box-shadow:0 10px 30px rgba(120,30,8,.35),0 2px 6px rgba(120,30,8,.25);
  transition:transform .25s cubic-bezier(.28,.11,.32,1),background .25s;
}
.open-btn:hover{background:#fff;transform:translateY(-3px)}
.open-btn:active{transform:translateY(0)}
.open-btn:focus-visible{outline:3px solid #FFE3C7;outline-offset:3px}
.open-btn svg{flex:none}
.cover .foot{
  position:absolute;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));
  font-size:11.5px;letter-spacing:1px;color:rgba(255,244,232,.85);
}
/* ===== 贺卡内页 ===== */
.inner{
  width:100%;max-width:440px;
  background:var(--surface);border-radius:24px;
  padding:28px 24px 26px;text-align:center;
  border:1px solid color-mix(in srgb,#E8552D 22%,transparent);
  box-shadow:0 18px 50px rgba(42,29,20,.16);
  opacity:0;transform:translateY(26px) scale(.94);visibility:hidden;pointer-events:none;
  transition:opacity .55s cubic-bezier(.28,.11,.32,1),transform .55s cubic-bezier(.28,.11,.32,1),visibility .55s;
}
body.opened .inner{opacity:1;transform:none;visibility:visible;pointer-events:auto}
.inner .anim{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
body.opened .inner .anim{opacity:1;transform:none}
body.opened .inner .anim.d1{transition-delay:.15s}
body.opened .inner .anim.d2{transition-delay:.28s}
body.opened .inner .anim.d3{transition-delay:.41s}
body.opened .inner .anim.d4{transition-delay:.54s}
body.opened .inner .anim.d5{transition-delay:.67s}
.inner .to{
  display:inline-flex;align-items:center;gap:6px;
  color:#fff;background:var(--acc);border-radius:999px;
  padding:5px 14px;font-size:12px;font-weight:800;letter-spacing:2px;
}
.inner .photo-wrap{
  position:relative;margin:16px auto 4px;width:100%;max-width:100%;
  aspect-ratio:4/5;border-radius:16px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 18%,#FFF3E4 0%,#F7DFC4 46%,#F0CFAE 100%);
  border:1px solid color-mix(in srgb,#C9A24B 45%,transparent);
}
.inner .photo-wrap img{width:100%;height:100%;object-fit:contain;display:block}
.photo-cap{font-size:12px;color:#7A6253;letter-spacing:1.5px;margin:10px 0 14px}
.inner h2{font-size:26px;font-weight:800;color:var(--t1);letter-spacing:3px;margin:2px 0 10px}
.inner .bless{
  font-size:15px;color:#5C4638;text-align:left;line-height:2.05;
  background:linear-gradient(180deg,#FFF9F1,#FBEFE2);
  border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;white-space:pre-line;
}
.inner .bless b{color:#C93F1E}
.inner .sign{margin-top:16px;font-size:14.5px;color:var(--t1);font-weight:700;letter-spacing:2px}
.inner .sign small{display:block;margin-top:4px;font-size:12px;color:#8A7161;font-weight:400;letter-spacing:3px}
.back-btn{
  appearance:none;border:1.5px solid var(--acc);background:transparent;color:var(--acc);
  font-family:inherit;font-size:13.5px;font-weight:800;letter-spacing:2px;
  padding:10px 26px;border-radius:999px;cursor:pointer;margin-top:20px;
  transition:background .25s,color .25s,transform .25s;
}
.back-btn:hover{background:var(--acc);color:var(--on)}
.back-btn:active{transform:translateY(1px)}
.back-btn:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 35%,transparent);outline-offset:2px}
@media (max-width:380px){
  .inner{padding:22px 16px 20px}
  .inner .bless{font-size:14px;padding:15px 16px}
}
/* 桌面端居中留白 */
@media (min-width:768px){
  .stage{padding:32px 24px}
  .inner{max-width:460px}
  .cover h1{font-size:76px}
}
@media (prefers-reduced-motion:reduce){
  .cover,.inner,.inner .anim{transition-duration:.01s;transition-delay:0s}
  .open-btn,.back-btn{transition:none}
}
</style>
</head>

<script>
(function(){
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, parts = [], raf = null;
  var COLORS = ['#E8A33D', '#F4B942', '#E8552D', '#F7D9A8', '#FFF0DC'];

  function build(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W; cv.height = H;
    var n = Math.min(64, Math.max(22, Math.round(W * H / 26000)));
    parts = [];
    for (var i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 1 + Math.random() * 2.2,
        s: 0.15 + Math.random() * 0.42,
        a: Math.random() * Math.PI * 2,
        w: 0.18 + Math.random() * 0.5,
        o: 0.22 + Math.random() * 0.4,
        c: COLORS[(Math.random() * COLORS.length) | 0]
      });
    }
    draw();
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.globalAlpha = p.o;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function tick(){
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.y += p.s;
      p.a += 0.02;
      p.x += Math.sin(p.a) * p.w;
      if (p.y > H + 8) { p.y = -8; p.x = Math.random() * W; }
    }
    draw();
    raf = window.requestAnimationFrame(tick);
  }

  build();
  window.addEventListener('resize', build);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { raf = window.requestAnimationFrame(tick); }

  var cover = document.getElementById('cover');
  var inner = document.getElementById('inner');
  var openBtn = document.getElementById('openBtn');
  var backBtn = document.getElementById('backBtn');

  openBtn.addEventListener('click', function(){
    document.body.classList.add('opened');
  });
  backBtn.addEventListener('click', function(){
    document.body.classList.remove('opened');
  });
})();
</script>
